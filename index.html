<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Portage</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
  /* Brand (BrandPalette.swift / design/brand-spec.md): electric cyan on
     midnight navy, the app's mark as the only logo. Playback itself is the
     STOCK CAF player tinted cyan — only idle, loading and failure wear our
     screens.

     Written conservatively for Cast hardware: no `gap` (Chromium 84+) and no
     `inset` (87+), since a first-generation Chromecast is far behind a phone.
     Sizes are in vh/vw so one layout serves 720p, 1080p and 4K panels, and
     every screen keeps a title-safe margin because TVs overscan. */
  :root {
    --accent: rgb(25, 216, 230);      /* electric cyan — the app's primary */
    --blue: rgb(38, 140, 255);        /* glow gradient bridge */
    --violet: rgb(123, 69, 246);     /* ambient light only */
    --deep: rgb(11, 13, 34);          /* midnight navy surface */
    --ink: #F4F7FF;
    --muted: rgba(244, 247, 255, 0.58);
  }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: rgb(11, 13, 34); background: var(--deep);
    font-family: -apple-system, 'SF Pro Text', Roboto, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    color: #F4F7FF; color: var(--ink);
    cursor: none;
  }
  cast-media-player {
    --theme-hue: 187;
    --progress-color: var(--accent);
    --splash-image: none;
    /* Brands the stock surfaces we don't draw ourselves. */
    --logo-image: url(icon.png);
  }
  #subs {
    position: absolute; left: 6vw; right: 6vw; bottom: 9vh; z-index: 15;
    text-align: center; pointer-events: none;
  }
  #subs span {
    font-size: 4.6vh; font-weight: 500; line-height: 1.42; white-space: pre-line;
    color: #fff; background: rgba(0, 0, 0, 0.62); padding: 0.2vh 1vh; border-radius: 0.6vh;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
    text-shadow: 0 0.2vh 0.5vh rgba(0, 0, 0, 0.55);
  }
  video#mse {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%; background: #000; display: none;
  }

  /* The mark's own light in a dark room: cyan spilling onto midnight navy,
     the same ambience as the app's launch screen and the browser receivers. */
  .screen {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 5vh 6vw;                 /* title-safe: TVs crop the edges */
    text-align: center;
    background:
      radial-gradient(120vw 90vh at 18% -12%, rgba(25,216,230,0.16), transparent 55%),
      radial-gradient(90vw 70vh at 88% 108%, rgba(123,69,246,0.12), transparent 60%),
      rgb(11, 13, 34);
  }
  #idle { display: flex; }

  /* The app mark. The PNG is a square with the navy baked in, so the corner
     radius is ours (same treatment as the browser receivers) — it reads as the
     app icon rather than a pasted tile. The cyan shadow lifts it off the
     background the way the icon sits on a home screen. */
  .mark {
    width: 15vh; height: 15vh; display: block;
    border-radius: 22%;
    box-shadow: 0 2.4vh 7vh rgba(25,216,230,0.34);
  }
  .wordmark {
    margin: 3.4vh 0 0;
    font-size: 1.9vh; font-weight: 700;
    letter-spacing: 0.42em; text-transform: uppercase;
    color: rgb(25, 216, 230); color: var(--accent);
  }
  .headline { margin: 1.8vh 0 0; font-size: 4.4vh; font-weight: 600; letter-spacing: 0.005em; }
  .hint { margin: 1.6vh 0 0; font-size: 2.4vh; font-weight: 500; color: var(--muted); }

  /* Loading and failure keep the app identity in the corner, so the screen is
     never anonymous while a poster or a message is centred. */
  .watermark {
    position: absolute; top: 5vh; left: 6vw;
    display: flex; align-items: center;
  }
  .watermark img { width: 5.6vh; height: 5.6vh; display: block; border-radius: 22%; }
  .watermark span {
    margin-left: 1.6vh;
    font-size: 1.7vh; font-weight: 700;
    letter-spacing: 0.34em; text-transform: uppercase;
    color: var(--muted);
  }

  #loading .poster {
    max-height: 44vh; max-width: 56vw;
    border-radius: 1.6vh;
    box-shadow: 0 3vh 9vh rgba(0,0,0,0.6);
  }
  #loading .poster.empty { display: none; }
  #loading .placeholder {
    display: none; align-items: center; justify-content: center;
    width: 64vh; height: 36vh; border-radius: 1.6vh;
    background: radial-gradient(circle at 15% 0%, rgba(25, 216, 230, 0.42), rgba(25, 216, 230, 0) 62%),
                radial-gradient(circle at 100% 100%, rgba(123, 69, 246, 0.5), rgba(123, 69, 246, 0) 64%), #12153A;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07), 0 3vh 9vh rgba(0, 0, 0, 0.6);
  }
  #loading .placeholder span {
    display: flex; align-items: center; justify-content: center; width: 13.3vh; height: 13.3vh;
    border-radius: 50%; background: rgba(11, 13, 34, 0.45); box-shadow: inset 0 0 0 1px rgba(244, 247, 255, 0.16);
  }
  #loading .placeholder svg { width: 5.9vh; height: 5.9vh; margin-left: 0.8vh; }
  #loading .poster.empty ~ .placeholder { display: flex; }
  #loading .title {
    margin: 3.2vh 0 0;
    font-size: 3.2vh; font-weight: 600; max-width: 74vw;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  #error .mark-error {
    width: 12vh; height: 12vh; border-radius: 26%;
    background: linear-gradient(135deg, rgb(240, 93, 116), rgb(201, 59, 87));
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2.2vh 7vh rgba(240,93,116,0.38);
  }
  #error .mark-error svg { width: 52%; height: 52%; }
  #error .headline { font-size: 3.8vh; font-weight: 700; max-width: 78vw; }
  #error .detail {
    margin: 1.4vh 0 0;
    font-size: 2.4vh; font-weight: 500; color: var(--muted);
    max-width: 62vw; line-height: 1.45;
  }
  /* A failure tints the ambience red instead of cyan. */
  #error {
    background:
      radial-gradient(120vw 90vh at 18% -12%, rgba(240,93,116,0.18), transparent 55%),
      radial-gradient(90vw 70vh at 88% 108%, rgba(123,69,246,0.10), transparent 60%),
      rgb(11, 13, 34);
  }

  .spinner {
    width: 4.6vh; height: 4.6vh; margin: 3.4vh 0 0;
    border-radius: 50%;
    border: 0.55vh solid rgba(244,247,255,0.16);
    border-top-color: rgb(25, 216, 230);
    border-top-color: var(--accent);
    -webkit-animation: spin 0.9s linear infinite;
    animation: spin 0.9s linear infinite;
  }
  @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  #upnext { position: fixed; right: 6vw; bottom: 14vh; display: none; align-items: center; padding: 1.6vh;
    background: rgba(11, 13, 34, 0.92); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 2.2vh;
    box-shadow: 0 1.4vh 4.6vh rgba(0, 0, 0, 0.45); z-index: 20; }
  #upnext.show { display: flex; }
  #upnext .un-art { position: relative; width: 22vh; height: 12.4vh; flex: 0 0 auto; margin-right: 2vh; }
  #upnext .un-art img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 1.1vh;
    background: rgba(255, 255, 255, 0.08); }
  #upnext .un-noart { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; align-items: center;
    justify-content: center; border-radius: 1.1vh;
    background: radial-gradient(circle at 15% 0%, rgba(25, 216, 230, 0.42), rgba(25, 216, 230, 0) 62%),
                radial-gradient(circle at 100% 100%, rgba(123, 69, 246, 0.5), rgba(123, 69, 246, 0) 64%), #12153A;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07); }
  #upnext .un-noart span { display: flex; align-items: center; justify-content: center; width: 4.6vh; height: 4.6vh;
    border-radius: 50%; background: rgba(11, 13, 34, 0.45); box-shadow: inset 0 0 0 1px rgba(244, 247, 255, 0.16); }
  #upnext .un-noart svg { position: static; width: 2.1vh; height: 2.1vh; margin-left: 0.3vh; overflow: visible; }
  #upnext .un-art.noart .un-noart { display: flex; }
  #upnext .un-art.noart img { display: none; }
  #upnext svg { position: absolute; top: -0.55vh; left: -0.55vh; width: 23.1vh; height: 13.5vh; overflow: visible; }
  #un-ring { fill: none; stroke: rgb(25, 216, 230); stroke-width: 3; stroke-linecap: round; }
  #upnext .un-text { max-width: 40vh; }
  #upnext p { margin: 0; }
  #un-label { font-size: 1.9vh; font-weight: 700; color: rgb(25, 216, 230); margin-bottom: 0.6vh; }
  #un-title { font-size: 3vh; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #un-sub { font-size: 2vh; color: rgba(244, 247, 255, 0.58); margin-top: 0.5vh; }
</style>
</head>
<body>
<cast-media-player></cast-media-player>
<div id="subs"></div>
<video id="mse" autoplay playsinline></video>

<div id="idle" class="screen">
  <!-- Version badge lives INSIDE the idle screen so it hides with it —
       position:fixed still pins it to the corner while idle shows. -->
  <div style="position:fixed;right:10px;bottom:8px;font-size:1.2vh;letter-spacing:0.05em;
              color:rgba(244,247,255,0.25);pointer-events:none">2026-10-04.5</div>
  <img class="mark" src="icon.png" alt="">
  <p class="wordmark">Portage</p>
  <h1 class="headline">Ready to cast</h1>
  <p class="hint">Pick something in the app to play it here</p>
</div>

<div id="loading" class="screen">
  <div class="watermark"><img src="icon.png" alt=""><span>Portage</span></div>
  <img class="poster empty" alt="">
  <div class="placeholder"><span><svg viewBox="0 0 24 24"><path d="M8 5.6v12.8c0 .8.9 1.3 1.6.9l10-6.4c.6-.4.6-1.4 0-1.8l-10-6.4C8.9 4.3 8 4.8 8 5.6z" fill="#F4F7FF"/></svg></span></div>
  <div class="title"></div>
  <div class="spinner"></div>
</div>

<div id="error" class="screen">
  <div class="watermark"><img src="icon.png" alt=""><span>Portage</span></div>
  <div class="mark-error"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4.5 2.8 19a1.2 1.2 0 0 0 1 1.8h16.4a1.2 1.2 0 0 0 1-1.8L12 4.5z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4.4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="17.4" r="1.3" fill="#fff"/></svg></div>
  <h1 class="headline"></h1>
  <p class="detail"></p>
</div>

<div id="upnext">
  <div class="un-art">
    <img id="un-img" alt="">
    <div class="un-noart"><span><svg viewBox="0 0 24 24"><path d="M8 5.6v12.8c0 .8.9 1.3 1.6.9l10-6.4c.6-.4.6-1.4 0-1.8l-10-6.4C8.9 4.3 8 4.8 8 5.6z" fill="#F4F7FF"/></svg></span></div>
    <svg viewBox="0 0 168 98" preserveAspectRatio="none"><path id="un-ring" d="M14,2 H154 A12,12 0 0 1 166,14 V84 A12,12 0 0 1 154,96 H14 A12,12 0 0 1 2,84 V14 A12,12 0 0 1 14,2 Z"/></svg>
  </div>
  <div class="un-text">
    <p id="un-label">Up next</p>
    <p id="un-title"></p>
    <p id="un-sub"></p>
  </div>
</div>

<script>
// Before the Cast framework wraps MediaSource. While a Dolby-split stream
// load is active (set by the LOAD interceptor), a LONE video codec answers
// "unsupported" so Shaka routes the video buffer through the fMP4-splitter
// transmuxer (fmp4-split.js) — its muxed payload needs the split even though
// the codec itself is supported. Real codec strings end to end: markers in
// codec strings die in Shaka's normalizer (avc1.42E01E.pdl -> avc1.2a0NaN,
// measured 2026-08-23).
window.__dolbySplitActive = false;
(function () {
  if (!window.MediaSource) return;
  const originalITS = MediaSource.isTypeSupported.bind(MediaSource);
  const loneVideo = /^video\/mp4;\s*codecs="(avc1|avc3|hvc1|hev1)[^,"]*"$/i;
  MediaSource.isTypeSupported = function (type) {
    if (window.__dolbySplitActive && loneVideo.test(String(type || ''))) {
      return false;
    }
    return originalITS(type);
  };
})();
</script>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<script src="mp4box.all.min.js?v=2026-10-04.5"></script>
<!-- The MSE engine, shared verbatim with the WebRTC and LAN receivers and
     copied here by scripts/build-hosted-receiver.sh in the app repo. Must load
     BEFORE receiver.js, which hands it its host hooks the moment it runs. -->
<script src="tv-mse.js?v=2026-10-04.5"></script>
<script src="mkv-engine.js?v=2026-10-04.5"></script>
<script src="fmp4-split.js?v=2026-10-04.5"></script>
<script src="receiver.js?v=2026-10-04.5"></script>
</body>
</html>
